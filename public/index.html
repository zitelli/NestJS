<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Cubo Multiplayer (Servidor Autoritativo)</title>
  <style>
      body { margin: 0; overflow: hidden; background: #111; }
      #hud {
          position: fixed; top: 12px; left: 12px;
          color: #fff; font: 14px monospace;
          background: rgba(0,0,0,.5); padding: 8px 12px; border-radius: 6px;
          white-space: pre;
      }
  </style>
</head>
<body>
<div id="hud">Conectando…</div>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "socket.io-client": "https://cdn.socket.io/4.7.5/socket.io.esm.min.js"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { io } from 'socket.io-client';

  // ---------- Cena 3D ----------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111122);

  const camera = new THREE.PerspectiveCamera(
    60, window.innerWidth / window.innerHeight, 0.1, 1000
  );
  camera.position.set(0, 8, 12);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dirLight = new THREE.DirectionalLight(0xffffff, 1);
  dirLight.position.set(5, 10, 5);
  scene.add(dirLight);

  scene.add(new THREE.GridHelper(20, 20, 0x444466, 0x222244));

  // ---------- Gerenciador de cubos remotos ----------
  const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
  const cubeMeshes = new Map(); // id -> mesh
  let myId = null;

  function addOrUpdateCube(state) {
    let mesh = cubeMeshes.get(state.id);
    if (!mesh) {
      const mat = new THREE.MeshStandardMaterial({ color: state.color });
      mesh = new THREE.Mesh(cubeGeo, mat);
      mesh.position.y = 0.5;

      // Destaque para o próprio cubo
      if (state.id === myId) {
        mesh.material.emissive = new THREE.Color(0x333333);
      }

      scene.add(mesh);
      cubeMeshes.set(state.id, mesh);
    }
    mesh.position.x = state.x;
    mesh.position.z = state.z;
    mesh.rotation.y = state.rotY;
  }

  function removeCube(id) {
    const mesh = cubeMeshes.get(id);
    if (mesh) {
      scene.remove(mesh);
      mesh.material.dispose();
      cubeMeshes.delete(id);
    }
  }

  // ---------- Socket.io ----------
  const socket = io('http://localhost:3000');
  const hud = document.getElementById('hud');

  socket.on('connect', () => {
    hud.textContent =
      'Arraste o mouse: gira a câmera\n' +
      'H/J: zoom';
  });

  socket.on('init', ({ myId: id, world }) => {
    myId = id;
    for (const cube of Object.values(world.cubes)) {
      addOrUpdateCube(cube);
    }
  });

  socket.on('cube:joined', (cube) => addOrUpdateCube(cube));
  socket.on('cube:moved', (cube) => addOrUpdateCube(cube));
  socket.on('cube:left', ({ id }) => removeCube(id));

  socket.on('disconnect', () => {
    hud.textContent = 'Desconectado.';
  });

  // Câmera orbital em coordenadas esféricas
  let orbitYaw   = 0;                 // ângulo equatorial (horizontal)
  let orbitPitch = Math.PI / 4;       // ângulo polar (0 = topo, π/2 = equador)
  let orbitRadius = 12;               // distância ao cubo

  const ORBIT_SENS = 0.003;           // sensibilidade do mouse
  const PITCH_MIN  = 0.05;            // não deixa passar pelo polo norte
  const PITCH_MAX  = Math.PI / 2 - 0.05;  // não deixa descer abaixo do equador

  let dragging = false;

  renderer.domElement.addEventListener('mousedown', () => dragging = true);
  window.addEventListener('mouseup', () => dragging = false);

  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    orbitYaw   -= e.movementX * ORBIT_SENS;   // horizontal → equador
    orbitPitch -= e.movementY * ORBIT_SENS;   // vertical  → polos
    orbitPitch = Math.max(PITCH_MIN, Math.min(PITCH_MAX, orbitPitch));
  });

  const keysHeld = { h: false, j: false };
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'h' || k === 'j') keysHeld[k] = true;
  });
  window.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'h' || k === 'j') keysHeld[k] = false;
  });

  // ---------- Loop de render ----------
  function animate() {
    requestAnimationFrame(animate);

    // (Opcional) zoom ainda por teclas H/J
    if (keysHeld['h']) orbitRadius -= 0.2;
    if (keysHeld['j']) orbitRadius += 0.2;
    orbitRadius = Math.max(4, Math.min(30, orbitRadius));

    const me = cubeMeshes.get(myId);
    if (me) {
      const tx = me.position.x;
      const ty = 0;                  // olha para a base do cubo
      const tz = me.position.z;

      // Esféricas → cartesianas
      const offsetX = orbitRadius * Math.sin(orbitPitch) * Math.sin(orbitYaw);
      const offsetY = orbitRadius * Math.cos(orbitPitch);
      const offsetZ = orbitRadius * Math.sin(orbitPitch) * Math.cos(orbitYaw);

      // Suaviza a transição (lerp)
      camera.position.x += (tx + offsetX - camera.position.x) * 0.15;
      camera.position.y += (ty + offsetY - camera.position.y) * 0.15;
      camera.position.z += (tz + offsetZ - camera.position.z) * 0.15;

      camera.lookAt(tx, ty, tz);
    }

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
